<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="{{ url_for('static', path='login.css') }}">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="d-flex justify-content-center align-items-center min-vh-100">
    <div class="hero bg-white rounded p-4 md-" >

         <h1 class="text-center"> Login Page </h1>
    <form action="/login" method="post">
        <div class="content">
           Enter Email :-  <input class="ms- px-4" type="email" placeholder="Enter Email....." name="email" required> <br>
           Enter Password :-  <input class="mx-auto px-3" type="password" placeholder="Enter password....." name="pswd" required>
           <input type="submit" value="Login">
        </div>
    </form>
        <a href="#" id="forgotPassword">Forgot Password?</a>
        <a href="/register">No Account ? Register</a>

    </div>
   

    <dialog id="forgotPasswordDialog">
  <h2>Forgot Password?</h2>

    <form id="forgotPasswordForm" action="/forgot" method="post">
        <label for="resetEmail">Enter your email</label>
        <input
        type="email"
        name="email"
        placeholder="you@example.com"
        required
        >
        <label >New Password :- </label>
        <input type="password"
        name="pswd"required>

        <button type="submit">Send OTP</button>
        <button type="button" id="closeDialog">Cancel</button>
    </form>
    </dialog>


    <script>
    const forgotPassword = document.getElementById("forgotPassword");
    const dialog = document.getElementById("forgotPasswordDialog");
    const closeDialog = document.getElementById("closeDialog");

    forgotPassword.addEventListener("click", (event) => {
        event.preventDefault();
        dialog.showModal();
    });

    closeDialog.addEventListener("click", () => {
        dialog.close();
    });
    </script>

    
    <div class="message">
        {{message}}
    </div>
</body>
</html>
