<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="	https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</head>
<body>
    <form action="/register" method="post">
        <div>
           Enter Email :-  <input type="email" name="email" placeholder="Enter Email....." required> <br>
           Enter Password :-  <input type="text" name="ps_text" placeholder="Enter password....." required>
           Confirm Password :-  <input type="password" name="pswd" required>
           <input type="submit" value="Register">
        </div>
        <a href="/">Already Account ? Login</a>
    </form>

      <a href="#" id="forgotPassword">Forgot Password?</a>
        <a href="/register">No Account ? Register</a>

    <dialog id="forgotPasswordDialog">
  <h2>Forgot Password?</h2>

    <form id="forgotPasswordForm" action="/forgot" method="post">
        <label for="resetEmail">Enter your email</label>
        <input
        type="email"
        name="email"
        placeholder="you@example.com"
        required
        >
        <label >New Password :- </label>
        <input type="password"
        name="pswd"required>

        <button type="submit">Send OTP</button>
        <button type="button" id="closeDialog">Cancel</button>
    </form>
    </dialog>


    <script>
    const forgotPassword = document.getElementById("forgotPassword");
    const dialog = document.getElementById("forgotPasswordDialog");
    const closeDialog = document.getElementById("closeDialog");

    forgotPassword.addEventListener("click", (event) => {
        event.preventDefault();
        dialog.showModal();
    });

    closeDialog.addEventListener("click", () => {
        dialog.close();
    });
    </script>

    <div class="message">
        {{message}}
    </div>
</body>
</html>
